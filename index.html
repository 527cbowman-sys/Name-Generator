<!DOCTYPE html>
<html lang="en">
  <head>
    <title>Royal Name Generator</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
    <link rel="stylesheet" href="https://use.typekit.net/odu7pun.css" />
  </head>

  <body>
    <main>
      <div class="container">
        <div class="row justify-content-center">
          <div class="col-12">
            <div class="card mt-4">
              <div class="card-body text-center">
                <h3 class="card-title mb-4">What's Your Royal Name?</h3>

                <div id="output" class="fs-4 fw-bold mb-4"></div>
                <button
                  id="againBtn"
                  class="btn btn-secondary mb-3"
                  style="display: none"
                  onclick="resetForm()"
                >
                  Generate Again
                </button>

                <div id="formArea">
                  <form>
                    <!-- Gender -->
                    <div class="mb-3 text-start">
                      <label class="form-label">Gender</label>
                      <br>
                      <input type="radio" id="genderMale" name="gender"/>
                      <label for="genderMale" class="options">Male</label>
                      <br>
                      <input type="radio" id="genderFemale" name="gender"/>
                      <label for="genderFemale" class="options">Female</label>
                    </div>

                    <!-- Age -->
                    <div class="mb-3 text-start">
                      <label class="form-label">Age</label>
                      <input
                        type="number"
                        id="age"
                        class="form-control options"/>
                    </div>

                    <!-- Name -->
                    <div class="mb-3 text-start">
                      <label class="form-label">Your Name</label>
                      <input
                        type="text"
                        id="firstName"
                        class="form-control options"/>
                    </div>

                    <!-- Birthstone -->
                    <div class="mb-3 text-start">
                      <label class="form-label">Birthstone</label>
                      <select id="birthstone" class="form-select">
                        <option class="options" value="">Choose</option>
                        <option class="options" value="garnet">Garnet</option>
                        <option class="options" value="amethyst">Amethyst</option>
                        <option class="options" value="aquamarine">Aquamarine</option>
                        <option class="options" value="diamond">Diamond</option>
                        <option class="options" value="emerald">Emerald</option>
                        <option class="options" value="pearl">Pearl</option>
                        <option class="options" value="ruby">Ruby</option>
                        <option class="options" value="peridot">Peridot</option>
                        <option class="options" value="sapphire">Sapphire</option>
                        <option class="options" value="opal">Opal</option>
                        <option class="options" value="topaz">Topaz</option>
                        <option class="options" value="turquoise">Turquoise</option>
                      </select>
                    </div>

                    <!-- Music -->
                    <div class="mb-3 text-start">
                      <label class="form-label">Favorite Music</label>
                      <select id="music" class="form-select">
                        <option class="options" value="">Choose</option>
                        <option class="options" value="rock">Rock</option>
                        <option class="options" value="pop">Pop</option>
                        <option class="options" value="country">Country</option>
                        <option class="options" value="rap">Rap</option>
                        <option class="options" value="classical">Classical</option>
                      </select>
                    </div>

                    <!-- Town -->
                    <div class="mb-3 text-start">
                      <label class="form-label">Town</label>
                      <input
                        type="text"
                        id="town"
                        class="form-control options"/>
                    </div>

                    <button type="button" onclick="generateName()" class="btn">
                      Generate Royal Name
                    </button>
                  </form>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </main>

    <script src="script.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  </body>
</html>
