<!DOCTYPE html>
<html lang="en">
  <head>
    <title>Royal Name Generator</title>

    <!-- Required meta tags -->
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <!-- Bootstrap CSS -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />

    <!-- Custom CSS -->
    <link rel="stylesheet" href="styles.css" />
    <link rel="stylesheet" href="https://use.typekit.net/odu7pun.css" />
  </head>

  <body>
    <main>
      <div class="container">
        <div class="row justify-content-center">
          <div class="col-12">
            <div class="card mt-4">
              <div class="card-body">
                <h4 class="card-title mt-3 mb-4">What's Your Royal Name?</h4>

                <form>

                  <!-- GENDER -->
                  <div class="container-fluid box mb-3">
                    <div class="row bg-light p-2">
                      <div class="col-12 form-check mb-2">
                        <input
                          class="form-check-input"
                          type="radio"
                          name="gender"
                          id="genderMale"
                        />
                        <label class="form-check-label" for="genderMale">
                          Male
                        </label>
                      </div>

                      <div class="col-12 form-check">
                        <input
                          class="form-check-input"
                          type="radio"
                          name="gender"
                          id="genderFemale"
                        />
                        <label class="form-check-label" for="genderFemale">
                          Female
                        </label>
                      </div>
                    </div>
                  </div>

                  <!-- AGE -->
                  <div class="container-fluid box mb-3">
                    <div class="row bg-light p-2">
                      <div class="col-12">
                        <label for="age" class="form-label">Age</label>
                        <input
                          type="number"
                          class="form-control"
                          id="age"
                        />
                      </div>
                    </div>
                  </div>



                  <!-- NAME -->
                  <div class="container-fluid box mb-3">
                    <div class="row bg-light p-2">
                      <div class="col-12 mb-3">
                        <label for="name" class="form-label">
                          Your Name
                        </label>
                        <input
                          type="text"
                          class="form-control"
                          id="name"
                        />
                      </div>
                    </div>
                  </div>



                  <!-- BIRTHSTONE -->
                <div class="container-fluid box 75">
                  <div class="row bg-light p-2">
                    <div class="col-12 mb-3">
                    <label
                          for="birthstone"
                          class="form-label fw-semibold"
                        >
                          Birthstone
                        </label>
                        <select id="birthstone" class="form-select">
                          <option value="">Choose</option>
                          <option value="garnet">Garnet</option>
                          <option value="amethyst">Amethyst</option>
                          <option value="aquamarine">Aquamarine</option>
                          <option value="diamond">Diamond</option>
                          <option value="emerald">Emerald</option>
                          <option value="pearl">Pearl</option>
                          <option value="ruby">Ruby</option>
                          <option value="peridot">Peridot</option>
                          <option value="sapphire">Sapphire</option>
                          <option value="opal">Opal</option>
                          <option value="topaz">Topaz</option>
                          <option value="turquoise">Turquoise</option>
                        </select>
                      </div>
                    </div>
                    </div>
                  



                  <!-- MUSIC -->
                <div class="container-fluid box mb-3">
                  <div class="row bg-light p-2">
                    <div class="col-12 mb-3">
                    <label
                          for="music"
                          class="form-label fw-semibold"
                        >
                          Favorite Music Genre
                        </label>
                        <select id="music" class="form-select">
                          <option value="">Choose</option>
                          <option value="rock">Rock</option>
                          <option value="pop">Pop</option>
                          <option value="country">Country</option>
                          <option value="rap">Rap</option>
                          <option value="classical">Classical</option>
                        </select>
                      </div>
                    </div>
                    </div>
                  
                  
                     <!-- TOWN -->
                  <div class="container-fluid box mb-3">
                    <div class="row bg-light p-2">
                      <div class="col-12 mb-3">
                        <label for="town" class="form-label">
                          Town You Live In
                        </label>
                        <input
                          type="text"
                          class="form-control"
                          id="town"
                        />
                      </div>
                    </div>
                  </div>




                  <button onclick="generatename()"
                    type="submit"
                    class="btn btn-light mt-4"
                  >
                    Generate
                  </button>

                </form>
              </div>
            </div>
          </div>
        </div>
      </div>
    </main>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="script.js"></script>
  </body>
</html>
